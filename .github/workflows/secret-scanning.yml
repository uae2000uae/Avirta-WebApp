name: Secret scanning (Gitleaks)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: Scan repo for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so commit ranges below resolve

      # The CLI is run directly (instead of gitleaks/gitleaks-action, which has no
      # `args` input) so the repo's .gitleaks.toml and the commit range are explicit.
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm -f "$tarball" checksums.txt
          gitleaks version

      - name: Pick commit range
        id: range
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Pushes and PRs scan only their new commits; a manual run scans all history.
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ "$EVENT" = "push" ]; then
            if [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              range="${PUSH_BEFORE}..${PUSH_AFTER}"
            elif [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
              # New branch (or force push): everything not already on the default branch.
              range="origin/${DEFAULT_BRANCH}..${PUSH_AFTER}"
            fi
          fi
          echo "log_opts=${range}" >> "$GITHUB_OUTPUT"
          echo "Scanning: ${range:-full history}"

      - name: Run Gitleaks
        id: gitleaks
        shell: bash
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          set -uo pipefail
          args=(git . --config .gitleaks.toml --no-banner --redact -v
                --report-format sarif --report-path gitleaks.sarif)
          if [ -n "$LOG_OPTS" ]; then args+=("--log-opts=$LOG_OPTS"); fi
          rc=0
          gitleaks "${args[@]}" || rc=$?  # `|| rc=` keeps Actions' bash -e from exiting here
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          # 0 = clean, 1 = leaks found (reported in the last step); anything else is a crash.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "Gitleaks failed to run (exit $rc)." >&2
            exit "$rc"
          fi

      - name: Upload SARIF to GitHub Security tab
        if: always() && hashFiles('gitleaks.sarif') != ''
        continue-on-error: true  # e.g. fork PRs cannot write security events
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Fail build on secret findings
        if: steps.gitleaks.outputs.exit_code == '1'
        shell: bash
        run: |
          echo "Secret(s) detected by Gitleaks. See the step log above or the 'Security' tab." >&2
          exit 1
