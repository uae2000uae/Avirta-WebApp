{# Light/dark mode and sound toggles (wired up in static/js/ui.js). #}
<button type="button" class="icon-btn" data-action="toggle-theme" title="Switch to dark mode" aria-label="Switch to dark mode"><i class="fas fa-moon" aria-hidden="true"></i></button>
<button type="button" class="icon-btn" data-action="toggle-sound" aria-pressed="true" title="Mute sounds" aria-label="Mute sounds"><i class="fas fa-volume-high" aria-hidden="true"></i></button>
