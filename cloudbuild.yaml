# Cloud Build config to deploy Avirta to Cloud Run service "avirta" from source.
# Uses Cloud Run's source-based deploy (Google Cloud buildpacks), so there is no
# Docker image to manage. The test suite runs first; if any test fails, the
# build stops and nothing is deployed.

substitutions:
  _REGION: us-central1
  _SERVICE_NAME: avirta
  # You can override _REGION and _SERVICE_NAME at trigger time

steps:
  # 1) Run the tests. Real secrets are replaced with dummy values so tests can
  #    never reach GitHub or the AI services with live credentials.
  - id: tests
    name: "python:3.12-slim"
    entrypoint: bash
    env:
      - "GITHUB_TOKEN=disabled-in-tests"
      - "OPENAI_API_KEY=disabled-in-tests"
      - "ANTHROPIC_API_KEY=disabled-in-tests"
      - "SECRET_KEY=tests-only-secret-key"
      - "ADMIN_PASSWORD=disabled-in-tests"
      - "PIP_DISABLE_PIP_VERSION_CHECK=1"
    args:
      - "-c"
      - "pip install -q -r requirements-dev.txt && python -m pytest -q -p no:warnings"

  # 2) Deploy to Cloud Run directly from source (only runs if the tests passed)
  - id: deploy
    name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "${_SERVICE_NAME}",
        "--source=.",
        "--region=${_REGION}",
        "--platform=managed",
        "--allow-unauthenticated",
        "--port=8080",
        # STOPGAP: game state and question/report data live in this instance's
        # memory and local filesystem, which are not shared across instances.
        # Pin to a single always-on instance so multiplayer state stays
        # consistent. Remove these once state is moved to Firestore/Redis.
        "--min-instances=1",
        "--max-instances=1",
        # Route a given client back to the same instance (belt-and-suspenders).
        "--session-affinity",
        # Save live game rooms to Firestore (database "avirta-state") so a
        # redeploy or restart does not end games in progress.
        "--update-env-vars=ROOM_STORE=firestore,FIRESTORE_DATABASE=avirta-state",
        # SECRET_KEY signs session cookies; ADMIN_PASSWORD is the admin password
        # (admin access is password only).
        "--set-secrets=OPENAI_API_KEY=OPENAI_API_KEY:latest,GITHUB_TOKEN=GITHUB_TOKEN:latest,ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,SECRET_KEY=SECRET_KEY:latest,ADMIN_PASSWORD=ADMIN_PASSWORD:latest"
      ]

  # NOTE: A second "add-iam-policy-binding" step was REMOVED. Public access is
  # already granted by --allow-unauthenticated on the deploy above, so the extra
  # IAM read-modify-write was redundant and caused, when two builds overlapped:
  #   ERROR: (gcloud.beta.run.services.add-iam-policy-binding) ABORTED: There were
  #   concurrent policy changes ... ETag ... did not match the current policy's ETag
  # allUsers/roles/run.invoker only needs to be granted once. To (re)grant manually:
  #   gcloud run services add-iam-policy-binding ${_SERVICE_NAME} \
  #     --region=${_REGION} --member=allUsers --role=roles/run.invoker

timeout: "1600s"

# Log to Cloud Logging by default; remove or adjust as needed
options:
  logging: CLOUD_LOGGING_ONLY
